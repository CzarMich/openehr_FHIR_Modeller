# Optional layer: directory of administrator-managed CKM credentials.
# CKM_AUTH profiles refer to /run/secrets/ckm/<filename> in protected runtime settings.
# Mount the directory so atomic file replacement is visible during secret rotation.
services:
  app:
    volumes:
      - ${CKM_SECRET_HOST_DIR:?Set the private CKM secret directory}:/run/secrets/ckm:ro
