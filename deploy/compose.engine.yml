# Optional native engine. Shares only the application's network namespace and listens on loopback.
services:
  app:
    environment:
      OPENEHR_ENGINE_URL: http://127.0.0.1:8090
      OPENEHR_ENGINE_KEY_FILE: /run/secrets/engine-key
      OPENEHR_ENGINE_TIMEOUT: "50"
    volumes:
      - ${MODELLING_ENGINE_KEY_FILE:?Set a readable engine service-key file}:/run/secrets/engine-key:ro
  engine:
    image: ${MODELLING_ENGINE_IMAGE:-openehr-modelling-engine:local}
    build:
      context: .
      dockerfile: engine/Dockerfile
    network_mode: service:app
    depends_on:
      app:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 160
    mem_limit: 1536m
    cpus: 2
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    volumes:
      - ${MODELLING_ENGINE_KEY_FILE:?Set a readable engine service-key file}:/run/secrets/engine-key:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8090/health]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
