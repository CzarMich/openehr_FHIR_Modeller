# Optional layer: administrator-supplied, read-only SSH credentials.
# Set MODEL_GIT_KEY_HOST_PATH and MODEL_GIT_HOSTS_HOST_PATH before invoking Compose.
services:
  app:
    volumes:
      - ${MODEL_GIT_KEY_HOST_PATH:?Set the private deploy key path}:/run/secrets/model_git_key:ro
      - ${MODEL_GIT_HOSTS_HOST_PATH:?Set the pinned known_hosts path}:/run/secrets/model_git_known_hosts:ro
    environment:
      MODEL_GIT_SSH_KEY_FILE: /run/secrets/model_git_key
      MODEL_GIT_KNOWN_HOSTS_FILE: /run/secrets/model_git_known_hosts
