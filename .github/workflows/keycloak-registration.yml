name: Keycloak registration provider
on:
  workflow_dispatch:
  pull_request:
    paths: ['identity/keycloak-registration/**', '.github/workflows/keycloak-registration.yml']
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['identity/keycloak-registration/**', '.github/workflows/keycloak-registration.yml']
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f identity/keycloak-registration/pom.xml verify
      - run: python3 identity/keycloak-registration/functional.py
      - uses: actions/upload-artifact@v4
        with:
          name: keycloak-registration-provider
          path: identity/keycloak-registration/target/registration-domains-1.0.0.jar
