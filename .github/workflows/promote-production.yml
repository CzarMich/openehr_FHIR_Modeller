name: Promote FHIR Modeller Production

on:
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: Successful Dev delivery run for the current main revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fhir-modeller-production-promotion
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'CzarMich/openehr_FHIR_Modeller' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.dev.outputs.revision }}
    steps:
      - name: Require an actual successful Dev deployment of current main
        id: dev
        uses: actions/github-script@v7
        env:
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.DEV_RUN_ID)) throw new Error('Invalid Dev run ID');
            const run_id = Number(process.env.DEV_RUN_ID);
            if (!Number.isSafeInteger(run_id)) throw new Error('Invalid Dev run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (run.path !== '.github/workflows/deploy-dev.yml' || run.head_branch !== 'main' || run.head_sha !== main.object.sha || run.head_repository.full_name !== context.payload.repository.full_name || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Only a successful Dev delivery for current main can be promoted');
            if (context.sha !== main.object.sha) throw new Error('The dispatch revision is stale');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id});
            const deployed = jobs.some(job => job.name === 'deploy' && job.conclusion === 'success' && job.steps.some(step => step.name === 'Deploy pinned images on the marked local Dev host' && step.conclusion === 'success'));
            if (!deployed) throw new Error('The Dev deployment step did not succeed');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id});
            for (const name of [`fhir-dev-deployment-${run.head_sha}`, ...['app','chat','ingress','fhir','engine'].map(service => `fhir-dev-image-${service}-${run.head_sha}`)]) {
              if (!artifacts.some(artifact => artifact.name === name && !artifact.expired)) throw new Error(`Missing Dev evidence: ${name}`);
            }
            core.setOutput('revision', run.head_sha);

  promote:
    needs: verify
    runs-on: [self-hosted, Linux, X64, hyq-dev, fhir-modeller-dev]
    environment:
      name: production
      url: https://openehr-fhir-modeller.sandbox.hygeoniq.com/
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.dev_run_id }}
          github-token: ${{ github.token }}
          pattern: fhir-dev-image-*-${{ needs.verify.outputs.revision }}
          path: ${{ runner.temp }}/promotion/images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.dev_run_id }}
          github-token: ${{ github.token }}
          name: fhir-dev-deployment-${{ needs.verify.outputs.revision }}
          path: ${{ runner.temp }}/promotion/dev-evidence
      - name: Promote verified digests through production GitOps
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: bash scripts/promote-fhir-gitops.sh '${{ needs.verify.outputs.revision }}'
      - name: Configure direct production cluster verification
        env:
          SSH_KEY: ${{ secrets.PROD_CLUSTER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_CLUSTER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/fhir-prod-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/fhir-prod-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fhir-prod-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fhir-prod-ssh/"*
          ssh-keygen -F 192.168.178.30 -f "$RUNNER_TEMP/fhir-prod-ssh/known_hosts" >/dev/null
      - name: Verify hygeoniq-prod pods and public VPS access
        run: |
          set -euo pipefail
          remote="/home/hyq/modeller-verification/${{ needs.verify.outputs.revision }}"
          ssh_args=(-i "$RUNNER_TEMP/fhir-prod-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fhir-prod-ssh/known_hosts" -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" hyq@192.168.178.30 "mkdir -p '$remote'"
          tar -cf - scripts/verify-fhir-kubernetes.py scripts/mcp-smoke.py -C "$RUNNER_TEMP/promotion" production-images.json | ssh "${ssh_args[@]}" hyq@192.168.178.30 "tar -xf - -C '$remote'"
          ssh "${ssh_args[@]}" hyq@192.168.178.30 "python3 '$remote/scripts/verify-fhir-kubernetes.py' '$remote/production-images.json'" | tee "$RUNNER_TEMP/promotion/production-verification.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fhir-production-deployment-${{ needs.verify.outputs.revision }}
          path: |
            ${{ runner.temp }}/promotion/production-images.json
            ${{ runner.temp }}/promotion/infrastructure-revision
            ${{ runner.temp }}/promotion/production-verification.log
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/fhir-prod-ssh/key" "$RUNNER_TEMP/fhir-prod-ssh/known_hosts" "$RUNNER_TEMP/promotion/registry-auth.json"
