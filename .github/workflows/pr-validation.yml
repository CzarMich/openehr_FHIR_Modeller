name: PR validation

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-delivery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable Dev deployment boundaries
        run: |
          bash -n scripts/deploy-fhir-dev.sh
          python3 scripts/test-fhir-dev-delivery.py
          bash -n scripts/deploy-fhir-prod.sh
          python3 scripts/test-fhir-production-delivery.py
          python3 scripts/test-fhir-gitops-promotion.py
          bash -n scripts/promote-fhir-gitops.sh
          python3 tests/production/java-memory-guard.test.py
          bash -n scripts/fhir-prod-nginx.sh
          python3 tests/production/nginx-delivery.test.py
      - name: Verify proxy runtime log privacy using synthetic requests
        run: python3 scripts/test-proxy-log-privacy.py --base-image
  fhir-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: fhir/package-lock.json
      - run: npm ci --prefix fhir --ignore-scripts --no-audit
      - run: npm --prefix fhir test
      - name: Build the private FHIR toolchain
        run: docker build -f fhir/Dockerfile -t fhir-engine-ci .
      - name: Verify real compilation and accepted/rejected synthetic examples
        run: |
          mkdir -p fhir/acceptance-export
          chmod 777 fhir/acceptance-export
          # This hosted, one-shot CLI has no listener; use runner DNS for the
          # authoritative package download rather than Docker bridge DNS.
          docker run --rm --network host --memory=3g --cpus=2 -e FHIR_ACCEPTANCE_EXPORT=/evidence \
            -v "$PWD/fhir/acceptance-export:/evidence" fhir-engine-ci node test/acceptance.mjs
      - name: Preserve FHIR validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-engine-acceptance
          path: fhir/acceptance-export/
          if-no-files-found: warn
  modelling-runtime:
    uses: ./.github/workflows/dotnet-migration.yml

  specification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify requirement and implementation traceability
        run: |
          python3 scripts/spec-check.py
          python3 scripts/spec-check-test.py

  browser-chat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - run: npm ci --prefix chat --ignore-scripts --no-audit
      - run: npm --prefix chat run check:format
      - run: npm --prefix chat test
      - run: npx playwright install --with-deps chromium
        working-directory: chat
      - run: npm --prefix chat run test:browser
      - name: Optional dependency scan (deferred unless explicitly enabled)
        if: vars.MODELLER_RUN_SECURITY_VALIDATION == 'true'
        run: npm audit --prefix chat
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelling-browser-evidence
          path: chat/test-results/
          if-no-files-found: ignore
