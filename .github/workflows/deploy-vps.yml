name: Deploy openEHR Modelling Assistant
on:
  workflow_run:
    workflows: [PR validation]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: modelling-assistant-vps
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy the validated revision
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.MODELLING_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MODELLING_VPS_KNOWN_HOSTS }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = CzarMich/openehr-modelling-assistant
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/modelling-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/modelling-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/modelling-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/modelling-ssh/key" "$RUNNER_TEMP/modelling-ssh/known_hosts"
          ssh_options=(-i "$RUNNER_TEMP/modelling-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/modelling-ssh/known_hosts")
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$REVISION"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/release.tar.gz" "amcdr@82.165.59.171:/opt/openehr-modelling-assistant/incoming/$REVISION.tar.gz"
          ssh "${ssh_options[@]}" amcdr@82.165.59.171 "bash -s -- '$REVISION'" < scripts/deploy-vps.sh

          # Verify outside the piped shell: an early clean exit must not claim delivery.
          ssh "${ssh_options[@]}" amcdr@82.165.59.171 "grep -Fxq '$REVISION' /opt/openehr-modelling-assistant/current-revision"
