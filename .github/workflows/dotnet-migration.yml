name: .NET runtime validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dotnet-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Restore locked packages and build the C# service
        working-directory: dotnet
        run: |
          dotnet restore Modeller.Mcp --locked-mode -p:NuGetAudit=false
          dotnet build Modeller.Mcp -c Release --no-restore
          dotnet restore Modeller.Processing --locked-mode -p:NuGetAudit=false
          dotnet build Modeller.Processing -c Release --no-restore
          dotnet run --project Modeller.Operational.Tests -c Release -p:NuGetAudit=false
          dotnet run --project Modeller.Processing.Tests -c Release -p:NuGetAudit=false
          dotnet run --project Modeller.Database.Tests -c Release -p:NuGetAudit=false
      - name: Verify HTTP and stdio contracts, guide content and security boundaries
        run: |
          set -euo pipefail
          python3 dotnet/tests/run-contracts.py --dll dotnet/Modeller.Mcp/bin/Release/net10.0/Modeller.Mcp.dll | tee "$RUNNER_TEMP/dotnet-contracts.jsonl"
      - name: Verify protected C# workspace independently over HTTP
        run: python3 dotnet/tests/workspace-contracts.py --dll dotnet/Modeller.Mcp/bin/Release/net10.0/Modeller.Mcp.dll
      - name: Verify the complete application protocol and authentication boundaries
        run: |
          python3 dotnet/tests/application-contracts.py --dll dotnet/Modeller.Mcp/bin/Release/net10.0/Modeller.Mcp.dll
          python3 dotnet/tests/application-auth-contracts.py --dll dotnet/Modeller.Mcp/bin/Release/net10.0/Modeller.Mcp.dll
          dotnet run --project dotnet/Modeller.Application.Tests -c Release -p:NuGetAudit=false
      - name: Verify actual CDR HTTPS connection and template retrieval
        run: python3 dotnet/tests/cdr-contracts.py --evidence "$RUNNER_TEMP/cdr-acceptance.json"
      - name: Verify SharePoint immutable repository contracts over HTTPS
        run: python3 dotnet/tests/sharepoint-contracts.py --evidence "$RUNNER_TEMP/sharepoint-acceptance.json"
      - name: Verify remote FHIR definition and IG authentication contracts
        run: python3 dotnet/tests/fhir-remote-contracts.py --evidence "$RUNNER_TEMP/fhir-remote-acceptance.json"
      - uses: docker/setup-buildx-action@v3
      - name: Build the independent runtime image on the hosted runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dotnet/Dockerfile
          load: true
          push: false
          tags: modeller-dotnet-ci:${{ github.sha }}
          cache-from: type=gha,scope=dotnet-migration
          cache-to: type=gha,scope=dotnet-migration,mode=max
      - name: Verify packaged runtime contracts with synthetic data
        run: |
          set -euo pipefail
          python3 dotnet/tests/run-contracts.py --image modeller-dotnet-ci:${{ github.sha }} | tee "$RUNNER_TEMP/dotnet-runtime-contracts.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-migration-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dotnet-contracts.jsonl
            ${{ runner.temp }}/dotnet-runtime-contracts.jsonl
            ${{ runner.temp }}/cdr-acceptance.json
            ${{ runner.temp }}/sharepoint-acceptance.json
            ${{ runner.temp }}/fhir-remote-acceptance.json

  sql-server-safety:
    # Source write-denial/attack testing is deferred at the user's request.
    if: vars.MODELLER_RUN_SECURITY_VALIDATION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Verify vendor-neutral metadata and bounded query plans
        run: dotnet run --project dotnet/Modeller.Database.Tests -c Release -p:NuGetAudit=false
      - name: Verify SQL Server TLS, effective permissions and denied writes on synthetic data
        run: bash dotnet/tests/test-sql-server-fixture.sh

  primary-runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the complete primary application on hosted CI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          load: true
          push: false
          tags: modeller-primary-ci:${{ github.sha }}
          cache-from: type=gha,scope=primary-dotnet
          cache-to: type=gha,scope=primary-dotnet,mode=max
      - name: Verify actual packaged application and human authentication
        run: |
          test "$(docker inspect --format '{{.Config.User}}' modeller-primary-ci:${{ github.sha }})" = '1000:1000'
          python3 dotnet/tests/application-contracts.py --image modeller-primary-ci:${{ github.sha }} --product-smoke
          python3 dotnet/tests/application-auth-contracts.py --image modeller-primary-ci:${{ github.sha }}
      - name: Verify real authenticated terminology operation compatibility
        run: python3 dotnet/tests/terminology-contracts.py --image modeller-primary-ci:${{ github.sha }} --evidence "$RUNNER_TEMP/terminology-acceptance.json"
      - name: Preserve terminology fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminology-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/terminology-acceptance.json
          if-no-files-found: warn
      - name: Verify packaged authenticated CKM discovery and credential rotation
        run: python3 dotnet/tests/ckm-contracts.py --image modeller-primary-ci:${{ github.sha }} --evidence "$RUNNER_TEMP/ckm-acceptance.json"
      - name: Preserve CKM fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/ckm-acceptance.json
          if-no-files-found: warn
      - name: Verify exact internal audit cutover and restart persistence
        run: python3 dotnet/tests/storage-contracts.py --image modeller-primary-ci:${{ github.sha }} --evidence "$RUNNER_TEMP/storage-acceptance.json"
      - name: Preserve internal storage acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-storage-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/storage-acceptance.json
          if-no-files-found: warn
