services:
  app:
    image: openehr-modelling-assistant:protocol-test
    build:
      context: ${PROTOCOL_TEST_REPO:?}
      target: production
    environment:
      APP_ENV: testing
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,app,ingress
      CORS_ALLOWED_ORIGINS: ${PROTOCOL_TEST_ORIGIN:-http://localhost:3000}
    tmpfs: ['/tmp:mode=1777,size=64m']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ingress:
    image: openehr-modelling-ingress:protocol-test
    build:
      context: ${PROTOCOL_TEST_REPO:?}
      target: ingress
    user: '1000:1000'
    volumes:
      - ${PROTOCOL_TEST_REPO:?}/.docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ['127.0.0.1::8343']
    environment:
      XDG_CONFIG_HOME: /tmp/caddy
      XDG_DATA_HOME: /tmp/caddy
    tmpfs: ['/tmp:mode=1777,size=16m']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8343/ready]
      interval: 2s
      timeout: 5s
      retries: 15
