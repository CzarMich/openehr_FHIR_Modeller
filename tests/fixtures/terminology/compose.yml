services:
  terminology:
    image: node:22.22.1-bookworm-slim
    user: '${TERMINOLOGY_TEST_UID:-1000}:${TERMINOLOGY_TEST_GID:-1000}'
    command: [node, /fixture/server.mjs]
    volumes:
      - ${TERMINOLOGY_TEST_ROOT:?}:/fixture-data
      - ${TERMINOLOGY_TEST_REPO:?}/tests/fixtures/terminology/server.mjs:/fixture/server.mjs:ro
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    networks:
      default:
        aliases: [terminology-fixture]
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').accessSync('/fixture-data/ready')"]
      interval: 2s
      timeout: 5s
      retries: 15
  app:
    image: openehr-modelling-assistant:terminology-test
    build:
      context: ${TERMINOLOGY_TEST_REPO:?}
      target: production
    environment:
      APP_ENV: testing
      MODEL_REPOSITORY_PROVIDER: filesystem
      MODEL_REPOSITORY_PATH: /tmp/test-models
      MODEL_REPOSITORY_WRITE_ENABLED: 'true'
      TERMINOLOGY_FHIR_BASE_URL: https://terminology-fixture/fhir/
      TERMINOLOGY_API_KEY: fixture-terminology-key
      HTTP_CA_BUNDLE: /run/fixture-ca.crt
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,app,ingress
    volumes:
      - ${TERMINOLOGY_TEST_ROOT:?}/tls.crt:/run/fixture-ca.crt:ro
    tmpfs: ['/tmp:mode=1777,size=64m']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      terminology:
        condition: service_healthy
  ingress:
    image: openehr-modelling-ingress:terminology-test
    build:
      context: ${TERMINOLOGY_TEST_REPO:?}
      target: ingress
    user: '1000:1000'
    volumes:
      - ${TERMINOLOGY_TEST_REPO:?}/.docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ['127.0.0.1::8343']
    environment:
      XDG_CONFIG_HOME: /tmp/caddy
      XDG_DATA_HOME: /tmp/caddy
    tmpfs: ['/tmp:mode=1777,size=16m']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8343/ready]
      interval: 2s
      timeout: 5s
      retries: 15
